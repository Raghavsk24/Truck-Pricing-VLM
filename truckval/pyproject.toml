[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truckval"
version = "0.2.0"
description = "Price a used commercial truck from seller photographs, or refuse to."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
    "lightgbm>=4.3", "pydantic>=2.6", "pyarrow>=15.0",
]

[project.optional-dependencies]
vlm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["truckval", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
